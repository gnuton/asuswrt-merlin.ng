name: Images 
run-name: "Building images 🚀"
on:
  push:
    # Update-feed and documentation commits must not restart firmware builds.
    # Path filters are not evaluated for tag pushes, so tags still build.
    paths-ignore:
      - 'updates/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:
    inputs:
      model:
        description: "Model id to build (e.g. rt-ax92u). Leave empty to build all models."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    prepare-job:
      name: Prepare matrix
      runs-on: ubuntu-24.04
      outputs:
        matrix: ${{ steps.matrix.outputs.matrix }}
      steps:
        # Matrix cannot be used in a job-level "if", so filter the entries
        # here. An empty input builds everything; model=<id> selects only the
        # matching entry (for example rt-ax92u).
        - name: Select matrix entries
          id: matrix
          env:
            REQUESTED_MODEL: ${{ inputs.model }}
          run: |
            set -euo pipefail
            entries=(
              '{"model":"rt-ax92u","asset":"RT-AX92U","sdk":"src-rt-5.02axhnd","ui":"default","skip":false}'
              '{"model":"dsl-ax82u","asset":"DSL-AX82U","sdk":"src-rt-5.02axhnd.675x","ui":"default","skip":false}'
              '{"model":"tuf-ax5400","asset":"TUF-AX5400","sdk":"src-rt-5.02axhnd.675x","ui":"default","skip":false}'
              '{"model":"tuf-ax5400","asset":"TUF-AX5400","sdk":"src-rt-5.02axhnd.675x","ui":"tuf","skip":false}'
              '{"model":"tuf-ax3000","asset":"TUF-AX3000","sdk":"src-rt-5.02axhnd.675x","ui":"default","skip":false}'
              '{"model":"tuf-ax3000","asset":"TUF-AX3000","sdk":"src-rt-5.02axhnd.675x","ui":"tuf","skip":false}'
              '{"model":"rt-ax82u","asset":"RT-AX82U","sdk":"src-rt-5.02axhnd.675x","ui":"default","skip":false}'
              '{"model":"rt-ax95q","asset":"RT-AX95Q","sdk":"src-rt-5.02axhnd.675x","ui":"default","skip":false}'
              '{"model":"rt-axe95q","asset":"RT-AXE95Q","sdk":"src-rt-5.02axhnd.675x","ui":"default","skip":false}'
              '{"model":"rt-ax82u_v2","asset":"RT-AX82U_V2","sdk":"src-rt-5.04axhnd.675x","ui":"default","skip":false}'
              '{"model":"rt-ax5400","asset":"RT-AX5400","sdk":"src-rt-5.04axhnd.675x","ui":"default","skip":false}'
              '{"model":"tuf-ax3000_v2","asset":"TUF-AX3000_V2","sdk":"src-rt-5.04axhnd.675x","ui":"default","skip":false}'
              '{"model":"tuf-ax3000_v2","asset":"TUF-AX3000_V2","sdk":"src-rt-5.04axhnd.675x","ui":"tuf","skip":false}'
              '{"model":"rt-ax58u_v2","asset":"RT-AX58U_V2","sdk":"src-rt-5.04axhnd.675x","ui":"default","skip":false}'
            )

            # Every entry must be valid JSON and carry the packaging model used
            # by the release manifest.
            for entry in "${entries[@]}"; do
              if ! jq -e 'type == "object" and (.asset | type) == "string" and (.asset | length) > 0' >/dev/null 2>&1 <<< "${entry}"; then
                echo "::error::Invalid matrix entry (expected a JSON object with a non-empty \"asset\"): ${entry}"
                exit 1
              fi
            done

            model="${REQUESTED_MODEL,,}"
            if [ -n "${model}" ]; then
              selected=()
              for entry in "${entries[@]}"; do
                if [ "$(jq -r '.model' <<< "${entry}")" = "${model}" ]; then
                  selected+=("${entry}")
                fi
              done
              if [ "${#selected[@]}" -eq 0 ]; then
                echo "::error::Unknown model '${REQUESTED_MODEL}'. Valid values: rt-ax92u, dsl-ax82u, tuf-ax5400, tuf-ax3000, rt-ax82u, rt-ax95q, rt-axe95q, rt-ax82u_v2, rt-ax5400, tuf-ax3000_v2, rt-ax58u_v2."
                exit 1
              fi
              entries=("${selected[@]}")
            fi

            matrix=$(printf '%s\n' "${entries[@]}" | jq -cs '{include: [.[] | {cfg: .}]}')
            echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
            echo "${matrix}"
    build-job:
      name: Build
      needs: prepare-job
      runs-on: ubuntu-24.04
      if: needs.prepare-job.outputs.matrix != ''
      strategy:
        fail-fast: false
        matrix: ${{ fromJSON(needs.prepare-job.outputs.matrix) }}
      container:
        image: gnuton/asuswrt-merlin-toolchains-docker:latest
        env:
          MERLINUPDATE: "y"
          MODEL: ${{ matrix.cfg.model }}
          SDK: ${{ matrix.cfg.sdk }}
          UI: ${{ matrix.cfg.ui }}
          SKIP_BUILD: ${{ matrix.cfg.skip }}
          GIT_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
          GIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          PROJECT_DIR: "/project/repo"
          ARTIFACTS_DIR: "/project/artifacts/${{ matrix.cfg.model }}-${{ matrix.cfg.ui }}"
          CHANGELOG_FILE: "/tmp/CHANGELOG"
          PROJECTBASEDIR: "/project" # REMOVE_ME: Fixes https://github.com/SonarSource/sonarcloud-github-action/pull/58
        # Run the container as root so GitHub's file-command outputs
        # (GITHUB_OUTPUT/GITHUB_ENV) are writable by actions. The image's
        # "docker" user (UID 1000) does not match the runner user (UID 1001),
        # which previously caused EACCES in upload-artifact. Build/shell steps
        # are dropped back to the non-root "docker" user via defaults.run below.
        options: --user root
        volumes:
          - /mnt:/project # HACK: Use /mnt partition since bigger than others. This prevents to run out of space
      defaults:
        run:
          # The AsusWrt build system refuses to run as root.
          shell: gosu docker bash --noprofile --norc -e -o pipefail {0}
      steps:
        - name: Reject non-3004 tags
          # This repository only ships the 3004 firmware line. A tag from the
          # 3006 line must never start a build (and therefore a release) here.
          if: startsWith(github.ref, 'refs/tags/')
          shell: bash --noprofile --norc -e -o pipefail {0}
          run: |
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "${TAG}" != 3004.* ]]; then
              echo "::error::Refusing to build tag '${TAG}': only 3004.* tags are allowed in this repository."
              exit 1
            fi
            echo "Tag ${TAG} belongs to the 3004 line. Continuing."
        - name: Run debug commands - post
          run: |
            cd /
            echo "--- Disk available ----"
            df -h
        - name: Fix permissions in docker image
          if: matrix.cfg.skip == false
          # This step deliberately runs as root (container user) to prepare
          # the bind mounts before running the build as "docker".
          shell: bash --noprofile --norc -e -o pipefail {0}
          run: |
            chown -R docker:docker /github/home /home/docker /project
        - name: "Fetch code"
          if: matrix.cfg.skip == false
          run: |
            cd /project
            echo "Fetching ${GIT_REF} from ${GIT_REPO}"
            rm -rf "${PROJECT_DIR}"
            if git clone --depth 1 --branch "${GIT_REF}" "${GIT_REPO}" "${PROJECT_DIR}"; then
                echo "Code fetched successfully."
            else
                echo "Failed to fetch code. Check the repository and settings."
                exit 1
            fi

            ls /home/docker
        - name: "Set version"
          if: matrix.cfg.skip == false
          run: |
            cd ${PROJECT_DIR}
            export CIRCLE_TAG="${GITHUB_REF#refs/*/}"
            if [[ $GITHUB_REF_TYPE == "branch" || $GITHUB_REF_TYPE == "" ]]; then
              echo "Nothing to do. Not a release. Branch detected: ${CIRCLE_TAG}"
            else
                TAG=$(echo ${CIRCLE_TAG} | sed 's/^[^.]*\.//')
                MAJOR_VER=$(echo "${TAG}" | sed -E 's/([0-9.]*)[_-]?(.*)/\1/')
                MINOR_VER=$(echo "${TAG}" | sed -E 's/([0-9.]*)[_-]?(.*)/\2/')
                sed -i "s/SERIALNO=.*/SERIALNO=${MAJOR_VER}/g" release/src-rt/version.conf
                sed -i "s/EXTENDNO=.*/EXTENDNO=${MINOR_VER}/g" release/src-rt/version.conf
                echo "Release detected. Updating version.conf with MAJOR_VER=${MAJOR_VER} and MINOR_VER=${MINOR_VER}"
            fi
        - name: Generate changelog
          if: matrix.cfg.skip == false && matrix.cfg.ui == 'default'
          run: |
            cd ${PROJECT_DIR}
            python tools/get-last-notes.py > "${CHANGELOG_FILE}"
            cat "${CHANGELOG_FILE}"
        - name: "Build"
          if: matrix.cfg.skip == false
          run: |
            echo "----- Space available -----"
            df -h
            echo "----- I am: $(id) -----"
            cd ${PROJECT_DIR}/release/${SDK}
            echo "----- Files in dir: $(pwd) -----"
            ls -alh
            echo "----- Setting toolchains for ${SDK} -----"
            if [[ ${SDK} == "src-rt-5.04axhnd.675x" ]]; then
              source /home/docker/envs/bcm-hnd-ax-4.19.sh
            elif [[ ${SDK} == "src-rt-5.02axhnd.675x" ]]; then
              source /home/docker/envs/bcm-hnd.sh
            elif [[ ${SDK} == "src-rt-5.02axhnd" ]]; then
              source /home/docker/envs/bcm-hnd.sh
            else
              echo "SDK not supported"
              exit -1
            fi
            echo "----- hack-ish fix ---------"
            sudo ln -sf /home/docker/am-toolchains/brcm-arm-hnd /opt/toolchains
            echo "----- Check envs dir ---------"

            ls -alh /home/docker/envs/
            echo "----- Debugging env vars -----"
            env
            echo "------ Setting UI as $UI ---------"
            if [[ ${UI} == "tuf" ]]; then
              echo "Enabling TUF UI"
              sed -i 's/TUF_UI=n/TUF_UI=y/' ${PROJECT_DIR}/release/src-rt/target.mak
            fi

            echo "----- BUILD ${MODEL}-----"
            make "${MODEL}"
            # #### Just for testing ####
            # mkdir -p "${PROJECT_DIR}/release/${SDK}/image/"
            # echo "TEST" > "${PROJECT_DIR}/release/${SDK}/image/${MODEL}_${UI}_puresqubi.w"
            
        - name: "Prepare artifacts"
          if: matrix.cfg.skip == false
          run: |
            mkdir -p "${ARTIFACTS_DIR}"
            export IMAGE_PATH=${PROJECT_DIR}/release/${SDK}/image/
            echo "Removing images with boot loader."
            rm -rf ${IMAGE_PATH}/*cferom*

            files=("${IMAGE_PATH}"/*squashfs.pkgtb "${IMAGE_PATH}"/*.w)

            if [ ${#files[@]} -gt 0 ]; then
                for f in "${files[@]}"; do
                    if [ -f "$f" ] && [ "${f##*.}" != "md5" ]; then
                        echo "Creating MD5 signature for $f"
                        (cd "$(dirname "$f")" && md5sum "$(basename "$f")") > "$f.md5"
                        echo "Copying image $f to workspace"
                        cp "$f" "${ARTIFACTS_DIR}"
                        cp "$f.md5" "${ARTIFACTS_DIR}"
                    fi
                done
            else
                echo "No *.squashfs.pkgtb or *.w files found in ${IMAGE_PATH}"
            fi
            
            # Changelogs are the same for every model since they are built
            # from the same branch; include it in each default artifact.
            if [ -e "${CHANGELOG_FILE}" ]; then
              cp "${CHANGELOG_FILE}" "${ARTIFACTS_DIR}"
            fi
        - name: "Archive artifacts"
          if: matrix.cfg.skip == false
          uses: actions/upload-artifact@v7
          with:
            name: release-${{ matrix.cfg.model }}-${{ matrix.cfg.ui }}
            path: "/project/artifacts/${{ matrix.cfg.model }}-${{ matrix.cfg.ui }}"
    release-job:
      name: Publish
      needs: [prepare-job, build-job]
      runs-on: ubuntu-24.04
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      permissions:
        contents: write
      steps:
        - name: Download packages
          uses: actions/download-artifact@v8
        - name: Get release version
          run: |
            echo "version=${GITHUB_REF#refs/*/}" >> "${GITHUB_ENV}"
            echo "prerelease=$( [[ "${GITHUB_REF#refs/*/}" == *alpha* || "${GITHUB_REF#refs/*/}" == *beta* ]] && echo True || echo False )" >> "${GITHUB_ENV}"
        - name: Generate release metadata
          env:
            MATRIX: ${{ needs.prepare-job.outputs.matrix }}
          run: |
            set -euo pipefail

            version="${GITHUB_REF#refs/*/}"
            branch="${version%%.*}"
            repository="${GITHUB_REPOSITORY}"
            manifest="firmware-meta/firmware-release.json"
            sha256sums="firmware-meta/SHA256SUMS"
            images_tmp="$(mktemp)"
            seen_tmp="$(mktemp)"
            : > "${images_tmp}"

            mkdir -p firmware-meta
            : > "${sha256sums}.tmp"

            # The prepare job is the single source of truth for the model ->
            # packaging name and theme mapping. Skip entries that did not run.
            mapfile -t entries < <(jq -c '.include[].cfg | select(.skip != true)' <<< "${MATRIX}")
            if [ "${#entries[@]}" -eq 0 ]; then
              echo "::error::Matrix is empty; cannot build release metadata."
              exit 1
            fi

            for cfg in "${entries[@]}"; do
              model="$(jq -r '.model' <<< "${cfg}")"
              asset="$(jq -r '.asset' <<< "${cfg}")"
              ui="$(jq -r '.ui' <<< "${cfg}")"
              dir="release-${model}-${ui}"

              if [ ! -d "${dir}" ]; then
                echo "::error::Missing downloaded artifact directory '${dir}' for ${asset} (${ui})."
                exit 1
              fi

              if grep -Fxq "${asset}|${ui}" "${seen_tmp}"; then
                echo "::error::Duplicate model+variant in matrix: ${asset} (${ui})."
                exit 1
              fi
              echo "${asset}|${ui}" >> "${seen_tmp}"

              row_count=0
              while IFS= read -r -d '' file; do
                row_count=$((row_count + 1))
                base="$(basename "${file}")"
                size="$(stat -c '%s' "${file}")"
                md5="$(md5sum "${file}" | awk '{print $1}')"
                sha256="$(sha256sum "${file}" | awk '{print $1}')"

                if [ ! -f "${file}.md5" ]; then
                  echo "::error::Missing checksum file '${file}.md5' for ${base}."
                  exit 1
                fi
                published_md5="$(awk 'NR == 1 {print $1}' "${file}.md5")"
                if [ "${published_md5}" != "${md5}" ]; then
                  echo "::error::MD5 mismatch for ${base}: .md5 has '${published_md5}', computed '${md5}'."
                  exit 1
                fi

                jq -cn \
                  --arg model "${asset}" \
                  --arg variant "${ui}" \
                  --arg file "${base}" \
                  --argjson size "${size}" \
                  --arg md5 "${md5}" \
                  --arg sha256 "${sha256}" \
                  '{model: $model, variant: $variant, file: $file, size: $size, md5: $md5, sha256: $sha256}' \
                  >> "${images_tmp}"
                echo "${sha256}  ${base}" >> "${sha256sums}.tmp"
              done < <(find "${dir}" -maxdepth 1 -type f \
                \( -name '*.pkgtb' -o -name '*.w' -o -name '*.trx' -o -name '*.bin' -o -name '*.img' -o -name '*.chk' \) \
                -print0 | sort -z)

              if [ "${row_count}" -eq 0 ]; then
                echo "::error::No firmware images found in '${dir}' for ${asset} (${ui})."
                exit 1
              fi
            done

            image_count="$(wc -l < "${images_tmp}")"
            if [ "${image_count}" -eq 0 ]; then
              echo "::error::No firmware images found in the downloaded artifacts."
              exit 1
            fi

            jq -s \
              --arg repository "${repository}" \
              --arg tag "${version}" \
              --arg branch "${branch}" \
              '{schemaVersion: 1, repository: $repository, tag: $tag, branch: $branch, images: .}' \
              "${images_tmp}" > "${manifest}"

            duplicate="$(jq -r '.images[] | "\(.model)|\(.variant)"' "${manifest}" | sort | uniq -d)"
            if [ -n "${duplicate}" ]; then
              echo "::error::Duplicate model+variant in manifest: ${duplicate}"
              exit 1
            fi

            LC_ALL=C sort -k2 -o "${sha256sums}" "${sha256sums}.tmp"
            rm -f "${sha256sums}.tmp"

            echo "Generated ${manifest} with ${image_count} image(s)."
            cat "${manifest}"
            echo "Generated ${sha256sums}:"
            cat "${sha256sums}"
        - name: Upload release metadata
          uses: actions/upload-artifact@v7
          with:
            name: release-metadata
            path: firmware-meta/
        - name: Publish archives and packages
          uses: softprops/action-gh-release@v3
          with:
            tag_name: ${{ env.version }}
            body_path: ${{ github.workspace }}/release-dsl-ax82u-default/CHANGELOG
            draft: true
            prerelease: ${{ env.prerelease }}
            files: |
              release*/*
              firmware-meta/*
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    
    manifest-job:
      name: Publish Manifest
      needs: [build-job, release-job]
      runs-on: ubuntu-24.04
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta')
      permissions:
        contents: write
      steps:
        - uses: actions/checkout@v7
          with:
            ref: ${{ github.event.repository.default_branch }}
        - name: Setup git config
          run: |
            # setup the username and email. I tend to use 'GitHub Actions Bot' with no email by default
            git config --global user.email "bot@gnuton.org"
            git config --global user.name "Circle CI BOT"
            git config --global push.default simple
        - name: Download packages
          uses: actions/download-artifact@v8
        - name: "Publish Manifest"
          env:
            UPDATE_DIR: "updates"
            DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          run: |
            set -euo pipefail

            export CIRCLE_TAG="${GITHUB_REF#refs/*/}"
            MAJOR_VER=$(echo "${CIRCLE_TAG}" | sed -E 's/([0-9.]*)[_-]?(.*)/\1/')
            MINOR_VER=$(echo "${CIRCLE_TAG}" | sed -E 's/([0-9.]*)[_-]?(.*)/\2/')
            RELEASE_NOTE_FILE=$(echo "${MAJOR_VER}_${MINOR_VER}_note.txt" | sed "s/\./_/")

            mkdir -p "${UPDATE_DIR}"
            MANIFEST="${UPDATE_DIR}/manifest2.txt"
            TMP_MANIFEST="$(mktemp)"

            echo "Generating ${MANIFEST} from downloaded default artifacts..."
            # Rewrite the line for every model that produced an artifact in
            # this release, and preserve the latest line for models that did
            # not. This keeps repeated runs idempotent and never advertises a
            # model for which this release has no image.
            for entry in \
              "dsl-ax82u:DSL-AX82U" \
              "rt-ax82u:RT-AX82U" \
              "rt-ax82u_v2:RT-AX82U_V2" \
              "rt-ax92u:RT-AX92U" \
              "rt-ax5400:RT-AX5400" \
              "tuf-ax5400:TUF-AX5400" \
              "tuf-ax3000:TUF-AX3000" \
              "tuf-ax3000_v2:TUF-AX3000_V2" \
              "rt-ax95q:RT-AX95Q" \
              "rt-axe95q:RT-AXE95Q" \
              "rt-ax58u_v2:RT-AX58U_V2"
            do
              model="${entry%%:*}"
              name="${entry#*:}"
              if [ -d "release-${model}-default" ]; then
                echo "${name}#FW${MAJOR_VER}#EXT${MINOR_VER}" >> "${TMP_MANIFEST}"
              elif [ -f "${MANIFEST}" ]; then
                grep -m1 "^${name}#" "${MANIFEST}" >> "${TMP_MANIFEST}" || true
              fi
            done
            mv "${TMP_MANIFEST}" "${MANIFEST}"
            cat "${MANIFEST}"

            CHANGELOG_FILE="release-dsl-ax82u-default/CHANGELOG"
            if [ ! -f "${CHANGELOG_FILE}" ]; then
              CHANGELOG_FILE="$(find . -maxdepth 2 -type f -name CHANGELOG -print -quit)"
            fi
            if [ -z "${CHANGELOG_FILE}" ] || [ ! -f "${CHANGELOG_FILE}" ]; then
              echo "::error::No CHANGELOG artifact found; cannot publish release note."
              exit 1
            fi

            cp "${CHANGELOG_FILE}" "${UPDATE_DIR}/${RELEASE_NOTE_FILE}"
            # Feed notes should end with exactly one newline so feed commits
            # stay free of "new blank line at EOF" warnings.
            perl -0pi -e 's/\n+\z/\n/' "${UPDATE_DIR}/${RELEASE_NOTE_FILE}"
            echo "Uploading ${MANIFEST} and ${RELEASE_NOTE_FILE}"
            git add "${UPDATE_DIR}"
            if git diff --cached --quiet; then
              echo "No update feed changes to commit."
            else
              git commit -m "Updating Notes and manifest to version:${MAJOR_VER} ${MINOR_VER} [SKIP_CI]"
              git push origin "HEAD:${DEFAULT_BRANCH}"
            fi
