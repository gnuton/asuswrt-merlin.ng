dynamic_hw_mode=0
# Primary interface for WMI_HOST_DYNAMIC_HW_MODE_FAST
#dynamic_hw_mode_primary_if=wifi0

# Spatial Reuse Parameter Set Element configuration
he_srp_ie_enable=1
he_srp_sr_control=0x03
he_srp_non_srg_obss_pd_max_offset=0
he_srp_srg_obss_pd_min_offset=0
he_srp_srg_obss_pd_max_offset=0
he_srp_srg_bss_color_bitmap_high=0
he_srp_srg_bss_color_bitmap_low=0
he_srp_srg_partial_bssid_bitmap_high=0
he_srp_srg_partial_bssid_bitmap_low=0

set_max_rx_mcs_map=0

# Minidump log config set
md_cp_ext_pdev=1
md_cp_ext_psoc=1
md_cp_ext_vdev=1
md_cp_ext_peer=0
md_dp_soc=1
md_dp_pdev=1
md_dp_vdev=1
md_dp_peer=0
#dp_srng_reo: reo_dest, reo_exception, reo_cmd, reo_status
md_dp_srng_reo=0
#dp_srng_tcl: tcl_data, tcl_cmd, tcl_status, tcl_comp
md_dp_srng_tcl=0
#dp_srng_wbm: wbm_desc_rel, wbm_idle_link
md_dp_srng_wbm=0
md_dp_link_desc_bank=0
#dp_srng_rxdma: rxdma_mon_buf, rxdma_mon_dst, rxdma_mon_status
md_dp_srng_rxdma=0
md_dp_hal_soc=1
#objmgr data structures
md_objmgr_psoc=1
md_objmgr_pdev=1
md_objmgr_vdev=1
#special HK phyB mode
mode_2g_phyb=0
#bss color default value
#val == 0 for disable feature
#val > 63 for random init
bss_color_default_val=255
#nss required data
nss_wifi_radio_pri_map=0
nss_wifi_pri_map_bits_per_radio=4
#htc pipe ready timeout in msec
htc_ready_timeout_msec=6000
#wmi_timeout in msec
wmi_ready_timeout_msec=15000
#fast boot vap up using acfg event
fast_boot_vap_mode=1
# cnss_fw_umount is to enable FW UMOUNT feature in lowmem profiles for memory
# optimizations.
# During the feature execution lowmem check is also be considered so as this
# won't be executed for other profiles
cnss_fw_umount=1
# Enable workqueue context for direct-DMA handling
# Value 0 = Workqueue Context
# Value 1 = Tasklet Context
direct_dma_handler_ctx=1
#Enable SW based peer filtering for tx monitor
tx_litemon_sw_peer_filtering=1
#SCS API feature enable/disable
scs_application_interface_enable=0
#Enable Target Dump compression before collection. Enabling this will copy
#the dump to /tmp/ before sending it to server.
#This is supported only on 1G or higher memory profiles only.
compres_fw_recov_dump_collect=0
# DP Non-SAWF stats maximum window size
dp_stats_max_window=10
# DP Non-SAWF stats maximum packets per window
dp_stats_max_packets_per_window=1000
# SAWF MDSUQ TID skid Enable/Disable
dp_sawf_msduq_tid_skid=1
# Timer value for dp sawf msduq reclaim feature in seconds
dp_sawf_reclaim_timer=20
